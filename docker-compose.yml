services:
  postgres:
    image: postgres:16-alpine
    container_name: creatorconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_password
      POSTGRES_DB: creatorconnect_dev
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d creatorconnect_dev']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - creatorconnect-network

  redis:
    image: redis:7-alpine
    container_name: creatorconnect-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', 'redis_local_password']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redis_local_password', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - creatorconnect-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: creatorconnect-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_local_user
      MINIO_ROOT_PASSWORD: minio_local_password
    ports:
      - '9000:9000' # S3 API endpoint
      - '9001:9001' # Web Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - creatorconnect-network

  minio-create-buckets:
    image: quay.io/minio/mc:latest
    container_name: creatorconnect-minio-create-buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minio_local_user minio_local_password;
      /usr/bin/mc mb -p myminio/creatorconnect-dev-media;
      /usr/bin/mc mb -p myminio/creatorconnect-media;
      exit 0;
      "
    networks:
      - creatorconnect-network

  migration-seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: creatorconnect-migration-seed
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres_local_password@postgres:5432/creatorconnect_dev?schema=public
    command: >
      sh -c "
      pnpm --filter @creatorconnect/database db:migrate &&
      pnpm --filter @creatorconnect/database db:seed
      "
    networks:
      - creatorconnect-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: creatorconnect-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration-seed:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres_local_password@postgres:5432/creatorconnect_dev?schema=public
      REDIS_URL: redis://:redis_local_password@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minio_local_user
      AWS_SECRET_ACCESS_KEY: minio_local_password
      R2_BUCKET_NAME: creatorconnect-dev-media
      SUPABASE_JWT_ISSUER: https://localhost.supabase.co/auth/v1
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:3002
    ports:
      - '3000:3000'
    networks:
      - creatorconnect-network

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    container_name: creatorconnect-realtime
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      LOG_LEVEL: info
      REDIS_URL: redis://:redis_local_password@redis:6379/0
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:3002
    ports:
      - '3001:3001'
    networks:
      - creatorconnect-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: creatorconnect-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migration-seed:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres_local_password@postgres:5432/creatorconnect_dev?schema=public
      REDIS_URL: redis://:redis_local_password@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minio_local_user
      AWS_SECRET_ACCESS_KEY: minio_local_password
      R2_BUCKET_NAME: creatorconnect-dev-media
    networks:
      - creatorconnect-network

  web-shell:
    build:
      context: .
      dockerfile: apps/web-shell/Dockerfile
      args:
        API_URL: ${API_URL:-http://api:3000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: creatorconnect-web-shell
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
      API_URL: http://api:3000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - '3002:3002'
    networks:
      - creatorconnect-network

networks:
  creatorconnect-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
