name: PR Validation & Quality Gates

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  validate:
    name: Lint, Typecheck, Test, Build & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_local_password
          POSTGRES_DB: creatorconnect_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        command: redis-server --requirepass redis_local_password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a redis_local_password ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @creatorconnect/database db:generate

      - name: Format Check
        run: pnpm format:check

      - name: Lint Workspaces
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Deploy Database Migrations & Seed Roles
        run: |
          pnpm --filter @creatorconnect/database db:migrate
          pnpm --filter @creatorconnect/database db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres_local_password@localhost:5432/creatorconnect_dev?schema=public

      - name: Unit & Integration Tests
        run: pnpm test:unit
        env:
          DATABASE_URL: postgresql://postgres:postgres_local_password@localhost:5432/creatorconnect_dev?schema=public
          REDIS_URL: redis://:redis_local_password@localhost:6379/0
          SUPABASE_JWT_ISSUER: https://localhost.supabase.co/auth/v1

      - name: Build All Workspaces
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres_local_password@localhost:5432/creatorconnect_dev?schema=public
          REDIS_URL: redis://:redis_local_password@localhost:6379/0
          SUPABASE_JWT_ISSUER: https://localhost.supabase.co/auth/v1

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  semgrep:
    name: Semgrep SAST Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep OSS SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten

  e2e:
    name: Playwright E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright E2E Smoke Tests
        run: pnpm test:e2e

      - name: Upload Test Report Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
