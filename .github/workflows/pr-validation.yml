name: PR Validation & Quality Gates

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  validate:
    name: Lint, Typecheck, Test, Build & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres_local_password@localhost:5432/creatorconnect_dev?schema=public
      REDIS_URL: redis://:redis_local_password@localhost:6379/0
      SUPABASE_JWT_ISSUER: https://localhost.supabase.co/auth/v1
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_local_password
          POSTGRES_DB: creatorconnect_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        command: redis-server --requirepass redis_local_password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a redis_local_password ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @creatorconnect/database db:generate

      - name: Format Check
        run: pnpm format:check

      - name: Lint Workspaces
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Deploy Database Migrations & Seed Roles
        run: |
          pnpm --filter @creatorconnect/database db:migrate
          pnpm --filter @creatorconnect/database db:seed

      - name: Build All Workspaces
        run: pnpm build

      - name: Unit & Integration Tests
        run: pnpm test:unit

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  semgrep:
    name: Semgrep SAST Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep OSS SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten

  e2e:
    name: Playwright E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres_local_password@localhost:5432/creatorconnect_dev?schema=public
      SUPABASE_JWT_ISSUER: https://auth.creatorconnect.local/auth/v1
      SUPABASE_JWKS_URL: http://jwks-stub:8080/.well-known/jwks.json
      ALLOW_HTTP_JWKS: 'true'
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @creatorconnect/database db:generate

      - name: Build E2E Workspace Dependencies
        run: pnpm exec turbo run build --filter=@creatorconnect/database...

      - name: Get Playwright Version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version)" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium-firefox-webkit

      - name: Install Playwright OS Dependencies
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium firefox webkit

      - name: Start Ephemeral Application Stack
        run: |
          docker compose up -d postgres redis minio minio-create-buckets migration-seed jwks-stub api web-shell
          # Wait for services to be ready
          echo "Waiting for API service to be healthy (http://127.0.0.1:3000/health)..."
          timeout 60 bash -c 'until docker compose exec -T api wget -qO- http://127.0.0.1:3000/health > /dev/null 2>&1; do sleep 2; done' || {
            echo "::error::API readiness check failed within 60s!"
            echo "=== API Health Probe Output ==="
            docker compose exec -T api wget -S -O - http://127.0.0.1:3000/health 2>&1 || true
            exit 1
          }
          echo "API service is ready."

          echo "Waiting for web-shell service to be ready (http://127.0.0.1:3002/)..."
          timeout 60 bash -c '
            attempt=0
            until docker compose exec -T web-shell wget -q -O /dev/null http://127.0.0.1:3002/ > /dev/null 2>&1; do
              attempt=$((attempt + 1))
              sleep 2
            done
            echo "Web-shell is ready (probes succeeded after ${attempt} retries)."
          ' || {
            echo "::error::Web-shell readiness poll timed out after 60s!"
            echo "=== Internal Probe (from web-shell container) ==="
            docker compose exec -T web-shell wget -S -O - http://127.0.0.1:3002/ 2>&1 || true
            echo "=== Host Probe (from runner to port 3002) ==="
            curl -sv http://127.0.0.1:3002/ 2>&1 || true
            exit 1
          }

      - name: Run Playwright E2E Tests
        run: pnpm test:e2e

      - name: Dump Ephemeral Stack Diagnostics on Failure
        if: failure()
        run: |
          echo "=================================================="
          echo "CONTAINER STATUS (docker compose ps -a)"
          echo "=================================================="
          docker compose ps -a
          echo "=================================================="
          echo "API CONTAINER HEALTH STATUS"
          echo "=================================================="
          docker inspect --format='{{json .State.Health}}' creatorconnect-api 2>&1 || true
          echo "=================================================="
          echo "WEB-SHELL CONTAINER HEALTH STATUS"
          echo "=================================================="
          docker inspect --format='{{json .State.Health}}' creatorconnect-web-shell 2>&1 || true
          echo "=================================================="
          echo "WEB-SHELL CONTAINER LOGS"
          echo "=================================================="
          docker compose logs --tail 200 web-shell
          echo "=================================================="
          echo "API CONTAINER LOGS"
          echo "=================================================="
          docker compose logs --tail 200 api
          echo "=================================================="
          echo "MIGRATION SEED LOGS"
          echo "=================================================="
          docker compose logs --tail 50 migration-seed

      - name: Teardown Application Stack
        if: always()
        run: docker compose down -v

      - name: Upload Test Report Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
